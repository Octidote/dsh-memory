<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆图谱 · 3D</title>
  <link rel="stylesheet" href="/dsh-memory/view.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <div class="brand-copy">
          <h1>记忆图谱</h1>
          <span id="stats" class="stats">加载中…</span>
        </div>
      </div>
      <div class="actions">
        <button id="auto" type="button" aria-pressed="false">自动旋转</button>
        <button id="reset" type="button" title="重置视角">重置</button>
        <button id="full" type="button" title="全屏">全屏</button>
        <button id="popout" type="button" title="在新窗口打开">独立窗口</button>
      </div>
    </header>
    <main>
      <section id="stage">
        <canvas id="canvas" aria-label="记忆关系三维图"></canvas>
        <div id="hint">拖动旋转 · 滚轮缩放 · 右键拖拽平移 · 点击节点</div>
        <div id="loading">正在读取记忆池…</div>
      </section>
      <aside id="side">
        <section class="side-section" aria-labelledby="categories-title">
          <h2 id="categories-title">记忆分类</h2>
          <div id="legend" class="legend"></div>
        </section>
        <section class="side-section" aria-labelledby="detail-title">
          <h2 id="detail-title">节点详情</h2>
          <div id="detail" class="detail muted">点击节点查看内容与关联</div>
          <div id="relations" class="relations"></div>
        </section>
      </aside>
    </main>
  </div>
  <script src="/dsh-memory/view.js"></script>
</body>
</html>
